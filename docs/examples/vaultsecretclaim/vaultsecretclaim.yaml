apiVersion: vault.in-cloud.io/v1alpha1
kind: VaultSecretClaim
metadata:
  name: ec8a00
  namespace: dlputi1u
spec:
  vaultConfigRef:
    name: vault-secret

  clusterRef:
    name: ec8a00

  # Совпадает с VaultClaim.secretsPrefix того же кластера.
  secretsPrefix: clusters/ec8a00

  deletionPolicy: Retain          # Retain (дефолт) | Purge

  secretList:
    # generate: пароль администратора Argo CD (raw + bcrypt).
    - name: argocd-admin
      type: generate
      destination:
        path: argocd
        key: admin.password
        hashedKey: admin.passwordBcrypt
      generate:
        length: 16
        hash: bcrypt

    # generate: пароль vmagent (без хеша).
    - name: vmagent
      type: generate
      destination:
        path: monitoring/vmagent
        key: password
      generate:
        length: 24
        hash: none

    # copy: общий OIDC staticClient → grafana.
    - name: grafana-oidc
      type: copy
      source:
        path: system/dex
        key: staticClient
      destination:
        path: grafana
        key: staticClient
