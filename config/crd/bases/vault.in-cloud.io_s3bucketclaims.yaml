---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: s3bucketclaims.vault.in-cloud.io
spec:
  group: vault.in-cloud.io
  names:
    kind: S3BucketClaim
    listKind: S3BucketClaimList
    plural: s3bucketclaims
    shortNames:
    - s3bc
    singular: s3bucketclaim
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.bucketName
      name: Bucket
      type: string
    - jsonPath: .spec.clusterRef.name
      name: Cluster
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          S3BucketClaim provisions a per-cluster S3 bucket and writes its credentials
          into Vault.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              bucket:
                description: |-
                  S3BucketSpec holds the cloud-manager create parameters. The bucket name is
                  derived by convention and recorded in status.bucketName.
                properties:
                  configurationId:
                    description: |-
                      ConfigurationID is the cloud-manager S3 configuration catalog id; empty
                      falls back to the operator default.
                    type: string
                  managedBy:
                    default: SYSTEM
                    description: ManagedBy selects the creation strategy; SYSTEM is
                      not customer-billed.
                    enum:
                    - SYSTEM
                    - CUSTOMER
                    type: string
                  name:
                    description: |-
                      Name adopts an existing bucket by its full server name (with the
                      server prefix) instead of creating one. An adopted bucket is removed on
                      Purge only with purgeAdopted. Immutable.
                    maxLength: 63
                    minLength: 3
                    pattern: ^[a-z0-9][a-z0-9-]*[a-z0-9]$
                    type: string
                  public:
                    default: false
                    type: boolean
                  purgeAdopted:
                    description: |-
                      PurgeAdopted lets deletionPolicy=Purge remove a bucket this claim adopted
                      (status.bucketOwnership=Adopted). Without it such a deletion is blocked.
                    type: boolean
                type: object
              clusterRef:
                description: |-
                  ClusterRef — неизменяемая метка кластера для имени и уникальности заявки.
                  Оператор не читает объект кластера по этой ссылке.
                properties:
                  name:
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              customerLogin:
                description: CustomerLogin is the account the bucket is created under.
                  Immutable.
                minLength: 1
                type: string
              deletionPolicy:
                default: Purge
                description: Purge removes the bucket and Vault keys on deletion;
                  Retain leaves them.
                enum:
                - Retain
                - Purge
                type: string
              region:
                type: string
              vault:
                properties:
                  destinationPath:
                    default: backup/s3
                    description: DestinationPath is relative to secretsPrefix.
                    maxLength: 256
                    type: string
                    x-kubernetes-validations:
                    - message: spec.vault.destinationPath must be relative and must
                        not contain '..'
                      rule: '!self.startsWith(''/'') && !self.contains(''..'')'
                  secretsPrefix:
                    description: SecretsPrefix must equal VaultClaim.secretsPrefix.
                      Immutable.
                    minLength: 1
                    type: string
                required:
                - secretsPrefix
                type: object
              vaultConfigRef:
                description: VaultConfigRef references a cluster-scoped VaultConfig.
                properties:
                  name:
                    minLength: 1
                    type: string
                required:
                - name
                type: object
            required:
            - bucket
            - clusterRef
            - customerLogin
            - vault
            - vaultConfigRef
            type: object
            x-kubernetes-validations:
            - message: spec.clusterRef.name is immutable
              rule: self.clusterRef.name == oldSelf.clusterRef.name
            - message: spec.customerLogin is immutable
              rule: self.customerLogin == oldSelf.customerLogin
            - message: spec.vault.secretsPrefix is immutable
              rule: self.vault.secretsPrefix == oldSelf.vault.secretsPrefix
            - message: spec.bucket.name is immutable
              rule: has(self.bucket.name) == has(oldSelf.bucket.name) && (!has(self.bucket.name)
                || self.bucket.name == oldSelf.bucket.name)
          status:
            properties:
              bucketName:
                description: |-
                  BucketName is the source of truth for idempotency, fixed on first
                  create or adopt.
                type: string
              bucketOwnership:
                description: |-
                  BucketOwnership records how status.bucketName was obtained. Empty on
                  claims written before this field: it is then derived once from the
                  BucketProvisioned reason ("Created" → Created, anything else → Adopted).
                enum:
                - Created
                - Adopted
                type: string
              bucketStatus:
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              endpoint:
                type: string
              keysWrittenHash:
                description: |-
                  KeysWrittenHash is deprecated: no longer written and cleared on the next
                  reconcile (credentials are compared with Vault directly). Kept in the
                  schema so an older operator can still read the object.
                type: string
              observedGeneration:
                format: int64
                type: integer
              pendingCreate:
                description: |-
                  PendingCreate is set, and persisted, before a create call and cleared
                  once status.bucketName is recorded. A bucket found by name while it is set
                  is the one this claim created; without it, a found bucket is Adopted.
                properties:
                  existingNames:
                    description: |-
                      ExistingNames are the server names of this login matching RequestedName
                      (with or without a "-N" suffix, in any status) before the create: none of
                      them is the bucket the create made.
                    items:
                      type: string
                    type: array
                  requestedName:
                    description: RequestedName is the name sent to cloud-manager (before
                      its prefix).
                    type: string
                  since:
                    description: |-
                      Since is when the create was decided; a create that cannot be located
                      is retried only after a grace period.
                    format: date-time
                    type: string
                required:
                - requestedName
                - since
                type: object
              phase:
                enum:
                - Pending
                - Ready
                - Failed
                - Deleting
                type: string
              writtenPath:
                description: |-
                  WrittenPath is the destinationPath (relative to spec.vault.secretsPrefix)
                  the credentials were last written to; on a destinationPath change the
                  keys this claim left there are removed.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
