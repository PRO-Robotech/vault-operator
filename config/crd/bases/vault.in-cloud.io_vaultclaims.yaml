---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: vaultclaims.vault.in-cloud.io
spec:
  group: vault.in-cloud.io
  names:
    kind: VaultClaim
    listKind: VaultClaimList
    plural: vaultclaims
    shortNames:
    - vc
    singular: vaultclaim
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.vaultConfigRef.name
      name: Config
      type: string
    - jsonPath: .spec.clusterRef.name
      name: Cluster
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          VaultClaim is the per-cluster Vault configuration request, one per infra
          cluster (1:1 with ClusterClaim).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              VaultClaimSpec is the desired state of a VaultClaim. One VaultClaim per
              infra cluster (1:1 with ClusterClaim).
            properties:
              auth:
                description: AuthSpec configures the per-cluster Vault Kubernetes
                  Auth Method.
                properties:
                  autoCreate:
                    default: true
                    description: |-
                      AutoCreate enables the operator to POST sys/auth; when false only
                      auth/{path}/config is written, assuming the mount already exists and
                      carries this claim's description.
                    type: boolean
                  issuer:
                    description: |-
                      Issuer is the OIDC issuer URL of the infra cluster; empty triggers
                      auto-discovery via /.well-known/openid-configuration.
                    type: string
                  manageConfig:
                    default: true
                    description: |-
                      ManageConfig makes the claim the owner of the mount: it writes
                      auth/{path}/config, rotates the reviewer JWT and manages the reviewer SA.
                      False makes the claim a guest that only adds its own roles and policies
                      to a mount configured by someone else (an operator mount from a
                      VaultConfig or an allow-listed one). Immutable.
                    type: boolean
                  mountPath:
                    description: |-
                      MountPath of the per-cluster auth method (convention:
                      "kubernetes-{metadata.name}"). Immutable.
                    minLength: 1
                    type: string
                  rolePruning:
                    description: |-
                      RolePruning selects which roles on the mount the claim deletes when they
                      leave spec.roles. Empty means Exclusive for an owner claim and Owned for
                      a guest. Exclusive applies only while the claim provably owns the mount.
                    enum:
                    - Exclusive
                    - Owned
                    type: string
                  tokenReviewer:
                    description: |-
                      TokenReviewer identifies the SA whose JWT Vault uses for TokenReview.
                      Required unless manageConfig is false.
                    properties:
                      serviceAccount:
                        description: |-
                          ServiceAccountRef references a SA in the infra cluster and controls
                          whether the operator creates it.
                        properties:
                          autoCreate:
                            default: true
                            description: |-
                              AutoCreate enables SSA of the SA and ClusterRoleBinding
                              (system:auth-delegator) in the infra cluster.
                            type: boolean
                          name:
                            minLength: 1
                            type: string
                          namespace:
                            minLength: 1
                            type: string
                        required:
                        - name
                        - namespace
                        type: object
                      ttl:
                        default: 24h
                        description: |-
                          TTL of the JWT minted via TokenRequest. The operator rotates when less
                          than 30% TTL remains.
                        type: string
                    required:
                    - serviceAccount
                    type: object
                required:
                - mountPath
                type: object
                x-kubernetes-validations:
                - message: spec.auth.manageConfig=false requires autoCreate=false
                    and rolePruning=Owned
                  rule: '!has(self.manageConfig) || self.manageConfig || (has(self.autoCreate)
                    && !self.autoCreate && has(self.rolePruning) && self.rolePruning
                    == ''Owned'')'
                - message: spec.auth.tokenReviewer is required unless spec.auth.manageConfig=false
                  rule: (has(self.manageConfig) && !self.manageConfig) || has(self.tokenReviewer)
              clusterRef:
                description: |-
                  ClusterRef references the ClusterClaim and its kubeconfig Secret; its
                  name is immutable. Required unless spec.auth.manageConfig is false: a
                  guest claim has no cluster of its own.
                properties:
                  kubeconfigSecret:
                    description: KubeconfigSecret is the Secret name; defaults to
                      "{Name}-infra-kubeconfig".
                    type: string
                  name:
                    description: Name of the ClusterClaim in the same namespace as
                      this VaultClaim.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              deletionPolicy:
                default: Purge
                description: |-
                  DeletionPolicy controls what deletion removes from Vault. Purge (default)
                  also disables the auth mount; Retain leaves it for its other consumers.
                  Transit keys are never deleted under either.
                enum:
                - Retain
                - Purge
                type: string
              policies:
                items:
                  description: |-
                    PolicySpec defines an ACL policy written as HCL into Vault. Names should
                    be prefixed with "{metadata.name}-" because Vault OSS policies live in a
                    global namespace.
                  properties:
                    identityPaths:
                      description: IdentityPaths are appended to the rules, one path
                        stanza each.
                      items:
                        description: |-
                          IdentityPath grants capabilities on a Vault path that names the logged-in
                          ServiceAccount.
                        properties:
                          capabilities:
                            description: Capabilities granted on the path. sudo and
                              deny are not offered.
                            items:
                              enum:
                              - create
                              - read
                              - update
                              - patch
                              - delete
                              - list
                              type: string
                            minItems: 1
                            type: array
                            x-kubernetes-list-type: set
                          path:
                            description: |-
                              Path is a Vault ACL path, without a leading "/", made of segments of
                              [a-z0-9._-] and the placeholders {serviceAccountName} and
                              {serviceAccountNamespace}; at least one placeholder, no globs, no
                              segment made of dots only. The pattern carries every rule: CEL here
                              would be costed per item of two unbounded lists.
                            maxLength: 512
                            minLength: 1
                            pattern: ^(?:(?:[a-z0-9._-]*[a-z0-9_-][a-z0-9._-]*|[a-z0-9._-]*(?:\{serviceAccountName\}|\{serviceAccountNamespace\})(?:[a-z0-9._-]|\{serviceAccountName\}|\{serviceAccountNamespace\})*)/)*[a-z0-9._-]*(?:\{serviceAccountName\}|\{serviceAccountNamespace\})(?:[a-z0-9._-]|\{serviceAccountName\}|\{serviceAccountNamespace\})*(?:/(?:[a-z0-9._-]*[a-z0-9_-][a-z0-9._-]*|[a-z0-9._-]*(?:\{serviceAccountName\}|\{serviceAccountNamespace\})(?:[a-z0-9._-]|\{serviceAccountName\}|\{serviceAccountNamespace\})*))*$
                            type: string
                        required:
                        - capabilities
                        - path
                        type: object
                      maxItems: 32
                      type: array
                      x-kubernetes-list-map-keys:
                      - path
                      x-kubernetes-list-type: map
                    name:
                      minLength: 1
                      type: string
                    rules:
                      description: |-
                        Rules is HCL ACL content rendered as a Go template. {{ .AuthMountAccessor }}
                        is the accessor of spec.auth.mountPath; {{ vaultSAName }} and
                        {{ vaultSANamespace }} write the Vault templates naming the logged-in
                        ServiceAccount. A Vault template written directly must be escaped:
                        {{`{{`}} … {{`}}`}}. No other template construct is admitted; at most
                        16384 bytes (MaxRulesLength).
                      maxLength: 16384
                      minLength: 1
                      type: string
                  required:
                  - name
                  type: object
                  x-kubernetes-validations:
                  - message: a policy needs rules, identityPaths or both
                    rule: has(self.rules) || has(self.identityPaths)
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              roles:
                items:
                  description: |-
                    RoleSpec binds {SA, namespace} to a list of policies inside the
                    per-cluster auth mount.
                  properties:
                    aliasNameSource:
                      description: |-
                        AliasNameSource selects how Vault names the entity alias of a login.
                        Empty sends nothing: a new role gets Vault's default (serviceaccount_uid),
                        an existing one keeps what it has.
                      enum:
                      - serviceaccount_uid
                      - serviceaccount_name
                      type: string
                    audience:
                      description: |-
                        Audience is the `aud` claim Vault verifies in the login JWT. Without it the
                        role accepts any token of the bound ServiceAccount.
                      type: string
                    boundServiceAccounts:
                      description: |-
                        BoundServiceAccounts identifies the ServiceAccounts allowed to log in
                        through this role: one name, or a set of names, all in one namespace.

                        A role still maps to one namespace and one list of policies: TTLs,
                        policies and bound CIDRs stay per role. The ServiceAccount that logged in is
                        visible in the token's metadata (service_account_name,
                        service_account_namespace) and in the audit log, so a role with several
                        names does not hide who logged in. Several namespaces need several roles.

                        Name and namespace refuse the glob characters Vault reads (*, ?, [): a glob
                        binds ServiceAccounts nobody named. The rule ratchets — a stored value that
                        does not change keeps validating, so claims written before the rule are
                        still updated; a new or changed value is judged.
                      properties:
                        name:
                          description: Name of the single ServiceAccount.
                          maxLength: 253
                          minLength: 1
                          pattern: ^[^*?\[]+$
                          type: string
                        names:
                          description: |-
                            Names of the ServiceAccounts, without globs. The operator writes them
                            sorted, so their order here is not drift.
                          items:
                            maxLength: 253
                            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                            type: string
                          maxItems: 32
                          minItems: 1
                          type: array
                          x-kubernetes-list-type: set
                        namespace:
                          maxLength: 63
                          minLength: 1
                          pattern: ^[^*?\[]+$
                          type: string
                      required:
                      - namespace
                      type: object
                      x-kubernetes-validations:
                      - message: exactly one of boundServiceAccounts.name and boundServiceAccounts.names
                          is required
                        rule: has(self.name) != has(self.names)
                    name:
                      description: Uniqueness scoped to auth/{mountPath}/role/.
                      minLength: 1
                      type: string
                    policies:
                      items:
                        type: string
                      minItems: 1
                      type: array
                    tokenExplicitMaxTTL:
                      description: TokenExplicitMaxTTL is a hard cap that renewal
                        cannot extend past.
                      type: string
                    tokenMaxTTL:
                      type: string
                    tokenNoDefaultPolicy:
                      description: |-
                        TokenNoDefaultPolicy drops Vault's built-in `default` policy. The referenced
                        policies must then grant auth/token/lookup-self themselves.
                      type: boolean
                    tokenTTL:
                      type: string
                    tokenType:
                      description: |-
                        TokenType is restricted to "service": batch tokens cannot be renewed and
                        cannot carry an explicit max TTL.
                      enum:
                      - service
                      type: string
                  required:
                  - boundServiceAccounts
                  - name
                  - policies
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              secretsPrefix:
                description: |-
                  SecretsPrefix is the path prefix under the shared KV-v2 mount used in
                  policies. Convention: "clusters/{metadata.name}". Immutable.
                minLength: 1
                type: string
              transit:
                description: Transit declares encryption keys owned by this claim;
                  absent skips the step.
                properties:
                  keys:
                    items:
                      description: |-
                        TransitKeySpec declares one encryption key. Hardening fields default to their
                        safe values. Type and Derived are fixed at creation; Exportable and
                        AllowPlaintextBackup can be turned on later but never off.
                      properties:
                        allowPlaintextBackup:
                          default: false
                          type: boolean
                        autoRotatePeriod:
                          description: |-
                            AutoRotatePeriod of zero disables rotation. Rotating requires rewriting
                            previously written data, so it is a procedure rather than a background job.
                          type: string
                        deletionAllowed:
                          default: false
                          description: DeletionAllowed governs manual deletion in
                            Vault; the operator never deletes keys.
                          type: boolean
                        derived:
                          default: false
                          description: Derived requires a context on every operation;
                            envelope consumers supply none.
                          type: boolean
                        exportable:
                          default: false
                          type: boolean
                        name:
                          description: Uniqueness scoped to {mountPath}/keys/.
                          minLength: 1
                          type: string
                        type:
                          default: aes256-gcm96
                          enum:
                          - aes256-gcm96
                          - aes128-gcm96
                          - chacha20-poly1305
                          type: string
                      required:
                      - name
                      type: object
                    minItems: 1
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  mountPath:
                    default: transit
                    description: MountPath of an existing Transit secrets engine.
                    minLength: 1
                    type: string
                type: object
              vaultConfigRef:
                description: |-
                  VaultConfigRef is mutable — changing it migrates this claim to a
                  different Vault.
                properties:
                  name:
                    minLength: 1
                    type: string
                required:
                - name
                type: object
            required:
            - auth
            - secretsPrefix
            - vaultConfigRef
            type: object
            x-kubernetes-validations:
            - message: spec.secretsPrefix is immutable
              rule: self.secretsPrefix == oldSelf.secretsPrefix
            - message: spec.clusterRef.name is immutable
              rule: has(self.clusterRef) == has(oldSelf.clusterRef) && (!has(self.clusterRef)
                || self.clusterRef.name == oldSelf.clusterRef.name)
            - message: spec.clusterRef is required unless spec.auth.manageConfig=false
              rule: (has(self.auth.manageConfig) && !self.auth.manageConfig) || has(self.clusterRef)
            - message: spec.auth.manageConfig is immutable
              rule: (!has(self.auth.manageConfig) || self.auth.manageConfig) == (!has(oldSelf.auth.manageConfig)
                || oldSelf.auth.manageConfig)
            - message: spec.auth.mountPath is immutable
              rule: self.auth.mountPath == oldSelf.auth.mountPath
            - message: spec.transit.mountPath is immutable
              rule: '!has(self.transit) || !has(oldSelf.transit) || self.transit.mountPath
                == oldSelf.transit.mountPath'
          status:
            description: VaultClaimStatus is the observed state of VaultClaim.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                format: int64
                type: integer
              phase:
                enum:
                - Pending
                - Configuring
                - Ready
                - Failed
                - Deleting
                type: string
              vault:
                description: VaultStatusSummary is a compact view of the actual Vault
                  state.
                properties:
                  appliedPolicies:
                    description: |-
                      AppliedPolicies is the ledger of policies this claim may have written:
                      a name enters it before the write and leaves it after the policy is
                      deleted.
                    items:
                      type: string
                    type: array
                  appliedRoles:
                    description: |-
                      AppliedRoles is the ledger of roles this claim may have written: a name
                      enters it before the write and leaves it after the role is deleted.
                    items:
                      type: string
                    type: array
                  authMountAccessor:
                    description: |-
                      AuthMountAccessor is the accessor the claim's templated policies were
                      last rendered with, read from sys/auth on a pass that renders one. A
                      different accessor in sys/auth means the mount was recreated: the
                      policies are rendered again.
                    type: string
                  authMountOwned:
                    description: |-
                      AuthMountOwned records a fact, never an intent: the mount answered 2xx
                      to this claim's POST sys/auth, sys/auth reports it as a kubernetes
                      mount carrying this claim's description, or authMountPath already
                      named it.
                    type: boolean
                  authMountPath:
                    description: |-
                      AuthMountPath is the auth mount this claim was accepted on. It is written
                      only once the mount is accepted, never before, so a claim that waited
                      or was refused does not hold it; a claim whose record names its mount
                      keeps that mount whatever its description (releases before ownership
                      checks recorded it for every claim and have configured the mount since).
                    type: string
                  configName:
                    type: string
                  lastDriftCheckAt:
                    description: |-
                      LastDriftCheckAt is the timestamp of the most recent drift detection
                      pass, whether drift was found or not.
                    format: date-time
                    type: string
                  lastReconcileAt:
                    format: date-time
                    type: string
                  secretsPrefix:
                    type: string
                  tokenReviewerJWT:
                    description: TokenReviewerJWTStatus tracks the reviewer JWT lifecycle.
                    properties:
                      expiresAt:
                        format: date-time
                        type: string
                      issuedAt:
                        format: date-time
                        type: string
                      lastRotated:
                        format: date-time
                        type: string
                      lastRotationAttempt:
                        description: LastRotationAttempt records the last attempt,
                          successful or not.
                        format: date-time
                        type: string
                    type: object
                  transitKeys:
                    description: |-
                      TransitKeys is the ledger of keys this claim observed or created. A recorded
                      key that later disappears is reported, never recreated.
                    items:
                      description: TransitKeyStatus is the observed state of one Transit
                        key, read back from Vault.
                      properties:
                        createdByClaim:
                          description: |-
                            CreatedByClaim distinguishes a key this operator created from an adopted
                            one. An entry with CreatedByClaim and LatestVersion 0 is an intent: it is
                            recorded before the key is created, so a crash between the create and the
                            status write cannot turn the claim's own key into an adopted one.
                          type: boolean
                        latestVersion:
                          type: integer
                        name:
                          minLength: 1
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
