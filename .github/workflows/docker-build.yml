name: docker-build-and-push
on:
  push:
    branches:
      - "*"
      - feature/*
      - fix/*
      - release/*
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"
  # A pull request builds the images and publishes nothing, so the build is a
  # check branch protection can require.
  pull_request:

jobs:
  docker-build-amd64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record before test source
        run: |
          python3 -I - before <<'PY'
          import json
          import os
          import subprocess
          import sys

          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()

          phase = sys.argv[1]
          assert phase in ('before', 'after'), phase
          head = git('rev-parse', 'HEAD')
          assert head == os.environ['GITHUB_SHA'], 'source HEAD differs from event SHA'
          assert not git('status', '--porcelain', '--untracked-files=no'), 'tracked source changed'
          if phase == 'before':
              assert not git('ls-files', '--others', '--exclude-standard'), 'initial checkout has untracked files'
          print('OPERATOR_SOURCE_V1 ' + json.dumps({
              'phase': phase, 'head': head, 'tree': git('rev-parse', 'HEAD^{tree}'),
              'tracked_clean': True, 'run_id': int(os.environ['GITHUB_RUN_ID']),
              'run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']), 'job': os.environ['GITHUB_JOB'],
          }, sort_keys=True))
          PY

      - uses: benjlevesque/short-sha@v3.0
        id: short-sha
        with:
          length: 8

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Устанавливаем buildx + общий builder
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      # Кэшируем слои для повторных сборок
      - name: Configure Buildx cache
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.ref_name }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Create sanitized branch name
        id: sanitize
        run: echo "branch=$(echo ${GITHUB_REF_NAME} | sed 's/\//-/g')" >> $GITHUB_OUTPUT

      # Устанавливаем QEMU для эмуляции amd64/arm64
      - name: Enable QEMU emulation
        run: docker run --rm --privileged tonistiigi/binfmt --install all

      # --- BUILD AND PUSH ---
      # A pull request builds and pushes nothing; it may come without secrets
      # (a fork), so its tags take the namespace "local".
      - name: Build and push vault-operator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' }}
          provenance: false
          platforms: linux/amd64
          tags: |
            ${{ github.event_name == 'push' && secrets.DOCKERHUB_USERNAME || 'local' }}/${{ github.event.repository.name }}:${{ steps.sanitize.outputs.branch }}-${{ steps.short-sha.outputs.sha }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Build and push vault-secret-operator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.vaultsecret
          push: ${{ github.event_name == 'push' }}
          provenance: false
          platforms: linux/amd64
          tags: |
            ${{ github.event_name == 'push' && secrets.DOCKERHUB_USERNAME || 'local' }}/vault-secret-operator:${{ steps.sanitize.outputs.branch }}-${{ steps.short-sha.outputs.sha }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Build and push s3-bucket-operator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.bucket
          push: ${{ github.event_name == 'push' }}
          provenance: false
          platforms: linux/amd64
          tags: |
            ${{ github.event_name == 'push' && secrets.DOCKERHUB_USERNAME || 'local' }}/s3-bucket-operator:${{ steps.sanitize.outputs.branch }}-${{ steps.short-sha.outputs.sha }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      # Двойник cloud-manager — служба стенда kind, не прод-компонент.
      - name: Build and push cmfake image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.cmfake
          push: ${{ github.event_name == 'push' }}
          provenance: false
          platforms: linux/amd64
          tags: |
            ${{ github.event_name == 'push' && secrets.DOCKERHUB_USERNAME || 'local' }}/cmfake:${{ steps.sanitize.outputs.branch }}-${{ steps.short-sha.outputs.sha }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      # Уборщик бакетов прогонов CI — инструмент CI, не прод-компонент.
      - name: Build and push s3-sweeper image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.s3-sweeper
          push: ${{ github.event_name == 'push' }}
          provenance: false
          platforms: linux/amd64
          tags: |
            ${{ github.event_name == 'push' && secrets.DOCKERHUB_USERNAME || 'local' }}/s3-sweeper:${{ steps.sanitize.outputs.branch }}-${{ steps.short-sha.outputs.sha }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Record after test source
        run: |
          python3 -I - after <<'PY'
          import json
          import os
          import subprocess
          import sys

          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()

          phase = sys.argv[1]
          assert phase in ('before', 'after'), phase
          head = git('rev-parse', 'HEAD')
          assert head == os.environ['GITHUB_SHA'], 'source HEAD differs from event SHA'
          assert not git('status', '--porcelain', '--untracked-files=no'), 'tracked source changed'
          if phase == 'before':
              assert not git('ls-files', '--others', '--exclude-standard'), 'initial checkout has untracked files'
          print('OPERATOR_SOURCE_V1 ' + json.dumps({
              'phase': phase, 'head': head, 'tree': git('rev-parse', 'HEAD^{tree}'),
              'tracked_clean': True, 'run_id': int(os.environ['GITHUB_RUN_ID']),
              'run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']), 'job': os.environ['GITHUB_JOB'],
          }, sort_keys=True))
          PY

      # Обновляем кэш после сборок
      - name: Move new cache
        if: always()
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache
