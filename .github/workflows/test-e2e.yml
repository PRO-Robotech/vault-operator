name: E2E Tests

on:
  push:
  pull_request:

jobs:
  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Record before test source
        run: |
          python3 -I - before <<'PY'
          import json
          import os
          import subprocess
          import sys

          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()

          phase = sys.argv[1]
          assert phase in ('before', 'after'), phase
          head = git('rev-parse', 'HEAD')
          assert head == os.environ['GITHUB_SHA'], 'source HEAD differs from event SHA'
          assert not git('status', '--porcelain', '--untracked-files=no'), 'tracked source changed'
          if phase == 'before':
              assert not git('ls-files', '--others', '--exclude-standard'), 'initial checkout has untracked files'
          print('OPERATOR_SOURCE_V1 ' + json.dumps({
              'phase': phase, 'head': head, 'tree': git('rev-parse', 'HEAD^{tree}'),
              'tracked_clean': True, 'run_id': int(os.environ['GITHUB_RUN_ID']),
              'run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']), 'job': os.environ['GITHUB_JOB'],
          }, sort_keys=True))
          PY

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install the latest version of kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-$(go env GOARCH)
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      - name: Running Test e2e
        run: |
          go mod tidy
          make test-e2e

      - name: Record after test source
        run: |
          python3 -I - after <<'PY'
          import json
          import os
          import subprocess
          import sys

          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()

          phase = sys.argv[1]
          assert phase in ('before', 'after'), phase
          head = git('rev-parse', 'HEAD')
          assert head == os.environ['GITHUB_SHA'], 'source HEAD differs from event SHA'
          assert not git('status', '--porcelain', '--untracked-files=no'), 'tracked source changed'
          if phase == 'before':
              assert not git('ls-files', '--others', '--exclude-standard'), 'initial checkout has untracked files'
          print('OPERATOR_SOURCE_V1 ' + json.dumps({
              'phase': phase, 'head': head, 'tree': git('rev-parse', 'HEAD^{tree}'),
              'tracked_clean': True, 'run_id': int(os.environ['GITHUB_RUN_ID']),
              'run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']), 'job': os.environ['GITHUB_JOB'],
          }, sort_keys=True))
          PY

  test-e2e-pipeline:
    name: Pipeline e2e (envtest + Vault dev)
    runs-on: ubuntu-latest
    steps:
      # The upgrade test builds the legacy release from its tag (git
      # archive v0.0.9); a shallow clone has no tags and fails it.
      - name: Clone the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Downloads the pinned, checksum-verified vault binary; a missing
      # binary fails the run instead of skipping it.
      - name: Running pipeline e2e
        run: make test-e2e-pipeline

  # 1000 guest claims under a manager against Vault 1.20.1: passes per claim
  # in a ten-minute steady window, new Vault tokens, process RSS.
  load:
    name: Load (1000 claims, envtest + Vault dev)
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Running the load measurement
        run: make test-load
