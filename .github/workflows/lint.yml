name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # goinstall builds the pinned linter with the module's Go: a prebuilt
      # binary built with an older Go refuses a newer go directive.
      - name: Run linter
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0
          install-mode: goinstall
