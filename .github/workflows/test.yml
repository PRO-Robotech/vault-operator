name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Running Tests
        run: make test

      # make test regenerates CRDs, RBAC, deepcopy and formatting; anything
      # it changed was not committed.
      - name: Generated files match the tree
        run: make verify-generated

      - name: Images are pinned by digest
        run: make verify-images
